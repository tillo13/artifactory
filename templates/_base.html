<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Artifactory{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .copy-btn:active { transform: translateY(1px); }
  </style>
</head>
<body class="bg-gradient-to-b from-slate-50 to-slate-100 text-slate-800 min-h-screen">

  <header class="border-b border-slate-200 bg-white">
    <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3">
        <span class="text-2xl">📐</span>
        <span class="font-bold text-lg">Artifactory</span>
        <span class="text-xs text-slate-400 font-mono">v{{ (self|attr('version'))() if false else '0.1.0' }}</span>
      </a>
      <nav class="flex gap-5 text-sm text-slate-600">
        <a href="/" class="hover:text-slate-900">Home</a>
        <a href="/about" class="hover:text-slate-900">About</a>
        <a href="/schema" class="hover:text-slate-900">Schema</a>
        <a href="/submit" class="hover:text-slate-900">Submit</a>
        <a href="/openapi.json" class="hover:text-slate-900">OpenAPI</a>
        <a href="https://github.com/tillo13/artifactory" target="_blank" rel="noopener"
           class="text-slate-500 hover:text-slate-900 inline-flex items-center gap-1">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2 .37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
          GitHub
        </a>
      </nav>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-10">
    {% block content %}{% endblock %}
  </main>

  <footer class="max-w-5xl mx-auto px-6 py-10 text-xs text-slate-400">
    <p>One backend. Many AI-designed frontends. Demo: house-build kanban.</p>
  </footer>

  <script>
    function copyToClipboard(btn, sourceSelector) {
      const src = document.querySelector(sourceSelector);
      if (!src) return;
      navigator.clipboard.writeText(src.innerText).then(() => {
        const original = btn.innerText;
        btn.innerText = '✓ copied';
        setTimeout(() => btn.innerText = original, 1800);
      });
    }
  </script>
</body>
</html>
